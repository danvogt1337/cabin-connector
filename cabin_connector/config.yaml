name: Cabin Connector
version: "2.0.0"
slug: cabin_connector
description: Verbindet dieses Home Assistant sicher mit dem Cabinmanager – ohne offene Ports, ohne Tunnel.
url: https://cabinmanager.de
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# Zugriff auf Home Assistant (REST und WebSocket) über den Supervisor; Netzwerk-Infos für die LAN-Adresse (Tablet)
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
# Tablet der Cabin: verschlüsselter Zugang im WLAN (eigenes Zertifikat, Anmeldung mit dem Geräte-Token des Tablets)
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Tablet-Zugang im WLAN (verschlüsselt)
panel_icon: mdi:home-export-outline
panel_title: Cabin Connector
options:
  server: https://cabinmanager.de
schema:
  server: url
